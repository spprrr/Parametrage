
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e6a8a">
<title>Fiches de paramétrage</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#17232b;--mut:#687781;--line:#d9e1e5;--acc:#126b89;--acc2:#e5f2f6;--good:#18794e;--bad:#b3261e;--warn:#8a5300;--shadow:0 5px 18px rgba(22,45,56,.06);color-scheme:light}
:root[data-theme="dark"]{--bg:#10181d;--card:#192329;--ink:#e6edf0;--mut:#9aabb4;--line:#30414a;--acc:#5bc0e2;--acc2:#163541;--good:#70d6a5;--bad:#ff8a80;--warn:#f0b75a;--shadow:0 5px 18px rgba(0,0,0,.18);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top);z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:12px 15px;display:flex;align-items:center;gap:10px}
.brand{min-width:0;flex:1}.brand h1{font-size:17px;line-height:1.2;margin:0;font-weight:750}.brand small{display:block;color:var(--mut);font-size:12px;margin-top:3px}
main{max-width:820px;margin:auto;padding:15px 14px 105px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 13px;min-height:42px;font-weight:650}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--bad)}
.btn.small{padding:7px 10px;min-height:36px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{flex:1;min-width:190px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:var(--card);min-height:46px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);min-width:0}
.stat strong{display:block;font-size:24px;color:var(--acc);line-height:1.15}.stat span{font-size:12px;color:var(--mut)}
.sortrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 1px 10px;color:var(--mut);font-size:12px}
select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;max-width:190px}
.card{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:13px;margin-bottom:9px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.card:active{transform:scale(.995)}
.card .num{font-size:23px;font-weight:800;color:var(--acc);min-width:56px;max-width:82px;overflow:hidden;text-overflow:ellipsis}
.card .content{flex:1;min-width:0}.card b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--mut);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{background:var(--acc2);border-radius:30px;padding:3px 8px;font-size:11px;color:var(--ink)}
.arrow{font-size:23px;color:var(--mut)}
.empty{text-align:center;padding:48px 18px;color:var(--mut);background:var(--card);border:1px dashed var(--line);border-radius:14px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.section-title{font-size:13px;font-weight:750;color:var(--mut);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.04em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.formtop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut);min-width:0}
input,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:11px 10px;min-height:44px;font-size:16px}
input:focus,textarea:focus{background:var(--card);border-color:var(--acc)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;box-shadow:var(--shadow)}
summary{padding:14px;display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;font-weight:700}
summary::-webkit-details-marker{display:none}
summary:after{content:"＋";margin-left:auto;color:var(--mut);font-size:18px}
details[open] summary:after{content:"−"}
.summarycount{font-size:11px;color:var(--mut);font-weight:500;white-space:nowrap}
.tol{font-size:11px;color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);padding:3px 7px;border-radius:20px}
.secbody{padding:0 13px 14px}
.gridfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gridfields .wide{grid-column:1/-1}
.group-title{font-weight:700;font-size:13px;margin:12px 0 6px}
.tablewrap{overflow-x:auto;margin-bottom:9px}
table{border-collapse:collapse;width:100%;min-width:320px}
th{font-size:11px;color:var(--mut);font-weight:650;padding:6px 4px;text-align:center}
td{padding:3px}
td input{text-align:center;padding:9px 3px;min-width:58px;min-height:42px}
td.value{text-align:center;padding:8px 4px;border:1px solid var(--line);font-weight:700}
td.value small{display:block;color:var(--warn);font-size:10px;font-weight:500;margin-top:2px}
td.value.blank{color:var(--mut);font-weight:400}
.kvgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}
.kv{padding:9px 0;border-bottom:1px solid var(--line);min-width:0}
.kv span{display:block;color:var(--mut);font-size:11px}.kv b{display:block;font-size:15px;overflow-wrap:anywhere}
.kv small{display:block;color:var(--warn);font-size:11px}
.hero{background:linear-gradient(135deg,var(--acc2),var(--card));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.hero .big{font-size:34px;font-weight:850;color:var(--acc);line-height:1.1}.hero h2{font-size:17px;margin:6px 0 2px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
.actionbar .btn{flex:1;max-width:360px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 15px;border-radius:10px;z-index:30;max-width:90%;box-shadow:var(--shadow);text-align:center}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modalbox{background:var(--card);width:100%;max-width:820px;border-radius:18px 18px 0 0;padding:17px 15px calc(17px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.modalbox h3{margin:0 0 5px}.modalbox p{color:var(--mut);font-size:13px;margin:0 0 10px}
.modalbox textarea{height:135px;font-size:12px}
.modalactions{display:flex;gap:8px;flex-wrap:wrap}.modalactions .btn{flex:1}
.photo-tools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.photo-item{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:1}.photo-item img{width:100%;height:100%;object-fit:cover;display:block}.photo-item button{position:absolute;right:5px;top:5px;background:#111b;color:#fff;border:0;border-radius:20px;padding:5px 9px}.photo-empty{color:var(--mut);font-size:13px;padding:10px 0}.hidden{display:none!important}
@media(max-width:430px){main{padding-left:11px;padding-right:11px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:21px}.formtop,.gridfields,.kvgrid{grid-template-columns:1fr 1fr}.btn{padding:9px 10px}.card{padding:11px}.card .num{min-width:48px;font-size:21px}}
@media print{body{background:#fff;color:#111;padding:0}header,.actionbar,.no-print{display:none!important}main{max-width:none;padding:0}.hero,.panel,details.sec{box-shadow:none;break-inside:avoid;border-color:#bbb}details.sec:not([open])>.secbody{display:block}summary:after{display:none}.kv span,.meta,th{color:#444}}
</style>
</head>
<body>
<header id="hd"><div class="brand"><h1>Fiches de paramétrage</h1><small>Gestion des paramètres des moules</small></div></header>
<main id="app"><div class="empty"><strong>Fiches de paramétrage</strong>Ouverture de l’application…<br>Si cet écran reste affiché, ouvrez le fichier avec Google Chrome.</div></main>
<script>
'use strict';
const N=(l,k,u)=>({l,k,u}),T=(l,k)=>({l,k,t:1}),R=(n,f)=>Array.from({length:n},(_,i)=>f(i+1));
const C3=['Vitesse','Pression','Position'];
const S=[
{t:'Informations générales',f:[T('N° machine','machine'),N('Nombre d’EMP opérationnelle','emp'),N('Cycle','cycle','s'),T('Type de matière','matiere'),T('Marque de matière','marque'),N('Taux de broyé','broye','%'),T('Marque de colorant','colorant'),T('Couleur','couleur'),T('REF','ref'),T('Procédé de séchage','sech'),N('Capacité de l’étuve','etuve'),N('Temps de séchage','tsech'),N('T° de séchage','tsT','°C')]},
{t:'Température fourreau (°C)',tol:5,f:[...R(6,i=>N('Zone '+i,'F'+i)),N('T° moule PF','pf'),N('T° moule PM','pm')]},
{t:'Température du régulateur (°C)',tol:5,f:[...R(30,i=>N('Zone '+i+(i<3?' (M)':' (N)'),'Z'+i)),T('N° thermorégulateur','thermo'),T('N° préchauffeur','prech')]},
{t:'Mouvement moule',g:[{n:'Fermeture',p:'fe',r:[1,2,3,4,5],c:C3},{n:'Ouverture',p:'ou',r:[1,2,3,4,5],c:C3}],f:[N('P. Sécurité','psec'),N('C. Sécurité','csec'),N('H. Pression','hpr'),N('F. Sécurité','fsec'),N('Force de verrouillage','force'),N('T. surveillance B.P','tbp'),N('T. surveillance H.P','thp')]},
{t:'Éjection',tol:15,g:[{n:'Retard',p:'er',r:[1,2],c:C3},{n:'Avance',p:'ea',r:[1,2],c:C3}],f:[T('Type d’éjection','tej'),{l:'Nombre d’éjection',k:'nej',nt:1}]},
{t:'Injection et maintien',g:[{n:'Injection',p:'in',r:[1],c:['Vitesse','Pression','Pt commut.','Temps réel']},{n:'Maintien',p:'ma',r:[1],c:['Vitesse','Pression','Temps']}],f:[N('Poids pièce','poids')]},
{t:'Plastification',tol:10,g:[{n:'',p:'pl',r:[5,6],c:['Vitesse (%)','Pression (bar)','Position (mm)','Succion (mm)']}],f:[N('T. refroidissement','trf','s'),N('Contre pression','cp')]},
];
const $=s=>document.querySelector(s),app=$('#app'),hd=$('#hd');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=v=>parseFloat(String(v??'').replace(',','.')),fm=n=>String(Math.round(n*10)/10);
const rg=(v,t)=>{const n=P(v);return isNaN(n)||!t?'':fm(n*(1-t/100))+' – '+fm(n*(1+t/100))};
const KEY='fiches_param_v1';let db=[];
const idbP=new Promise((res,rej)=>{const q=indexedDB.open('fiches_photos_db',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idb=(mode,fn)=>idbP.then(d=>new Promise((res,rej)=>{const t=d.transaction('p',mode),r=fn(t.objectStore('p'));t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error)}));
const idbPut=(id,v)=>idb('readwrite',o=>o.put(v,id)),idbGet=id=>idb('readonly',o=>o.get(id)),idbDel=id=>idb('readwrite',o=>o.delete(id));
const newPid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pcache=new Map();
const loadSrc=async id=>{if(pcache.has(id))return pcache.get(id);const v=await idbGet(id);if(v)pcache.set(id,v);return v||''};
async function migrate(){let ch=false;for(const r of db){const p=r.d.photos;if(Array.isArray(p)&&p.some(x=>String(x).startsWith('data:'))){const ids=[];for(const x of p){if(String(x).startsWith('data:')){const id=newPid();await idbPut(id,x);ids.push(id)}else ids.push(x)}r.d.photos=ids;ch=true}}if(ch)persist()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');db=Array.isArray(raw)?raw.filter(x=>x&&x.id&&x.d):[]}catch(e){db=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('Enregistrement impossible : stockage plein ou bloqué. Faites une sauvegarde.');return false}}
function toast(m){const old=$('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const dt=ts=>{const d=new Date(ts);return isNaN(d)?'':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};
const scrollTopPage=()=>window.scrollTo(0,0);
function head(title,sub='',btns=''){hd.innerHTML=`<div class="brand"><h1>${title}</h1>${sub?`<small>${sub}</small>`:''}</div>${btns}`}
function bar(html){return `<div class="actionbar">${html}</div>`}
function allText(r){return Object.values(r.d||{}).join(' ').toLocaleLowerCase('fr')}
function list(q=''){
 head('Fiches de paramétrage','Gestion des paramètres des moules',`<button class="btn small" id="theme" title="Changer le thème">☼</button><button class="btn small" id="backup">Sauvegarde</button>`);
 const query=q.trim().toLocaleLowerCase('fr');
 const L=[...db].sort((a,b)=>(b.ts||0)-(a.ts||0)).filter(r=>!query||allText(r).includes(query));
 const machines=new Set(db.map(r=>r.d.machine).filter(Boolean)).size;
 app.innerHTML=`<div class="stats"><div class="stat"><strong>${db.length}</strong><span>Fiches enregistrées</span></div><div class="stat"><strong>${machines}</strong><span>Machines concernées</span></div><div class="stat"><strong>${new Set(db.map(r=>r.d.moule)).size}</strong><span>Moules différents</span></div></div>
 <div class="toolbar"><input class="search" id="q" placeholder="Rechercher moule, produit, machine, matière…" value="${esc(q)}"><button class="btn" id="clear" aria-label="Effacer la recherche">Effacer</button></div>
 <div class="sortrow"><span>${L.length} résultat(s)</span><select id="sort"><option value="recent">Plus récentes</option><option value="old">Plus anciennes</option><option value="moule">N° moule (A → Z)</option></select></div>
 <div id="results">${L.length?L.map(r=>`<button class="card" data-id="${esc(r.id)}"><div class="num">${esc(r.d.moule||'—')}</div><div class="content"><b>${esc(r.d.produit)||'Sans produit'}</b><div class="meta">${dt(r.ts)}</div><div class="chips">${[r.d.machine&&'Machine '+r.d.machine,r.d.matiere,r.d.cycle&&'Cycle '+r.d.cycle+' s'].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><span class="arrow">›</span></button>`).join(''):`<div class="empty"><strong>${db.length?'Aucun résultat':'Aucune fiche enregistrée'}</strong>${db.length?'Essayez un autre mot-clé.':'Commencez par créer votre première fiche de paramétrage.'}</div>`}</div>
 ${bar('<button class="btn primary" id="new">＋ Nouvelle fiche</button>')}`;
 $('#q').oninput=e=>list(e.target.value);
 $('#clear').onclick=()=>list('');
 $('#new').onclick=()=>form();
 $('#backup').onclick=backup;
 $('#theme').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('fiches_theme',dark?'dark':'light')}catch(e){}};
 const sort=$('#sort');sort.onchange=()=>{const mode=sort.value;const sorted=[...L].sort((a,b)=>mode==='old'?(a.ts||0)-(b.ts||0):mode==='moule'?String(a.d.moule).localeCompare(String(b.d.moule),'fr',{numeric:true}):(b.ts||0)-(a.ts||0));$('#results').innerHTML=sorted.length?sorted.map(cardHTML).join(''):`<div class="empty">Aucun résultat</div>`;bindCards()};
 bindCards();scrollTopPage();
}
function cardHTML(r){return `<button class="card" data-id="${esc(r.id)}"><div class="num">${esc(r.d.moule||'—')}</div><div class="content"><b>${esc(r.d.produit)||'Sans produit'}</b><div class="meta">${dt(r.ts)}</div><div class="chips">${[r.d.machine&&'Machine '+r.d.machine,r.d.matiere,r.d.cycle&&'Cycle '+r.d.cycle+' s'].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div><span class="arrow">›</span></button>`}
function bindCards(){app.querySelectorAll('.card').forEach(c=>c.onclick=()=>view(c.dataset.id))}
function fieldInput(x,d){return `<label class="fl"><span>${x.l}${x.u?` (${x.u})`:''}</span><input data-k="${x.k}" ${x.t?'':'inputmode="decimal"'} enterkeyhint="next" autocomplete="off" value="${esc(d[x.k])}"></label>`}
function form(id,draft){
 const rec=id?db.find(r=>r.id==id):null,d=rec?rec.d:(draft||{});
 head(rec?'Modifier la fiche':'Nouvelle fiche','Renseignez les paramètres connus',`<button class="btn small" id="cancel">Annuler</button>`);
 app.innerHTML=`<div class="panel"><div class="formtop"><label class="fl"><span>N° moule *</span><input data-k="moule" enterkeyhint="next" autocomplete="off" value="${esc(d.moule)}" placeholder="Ex. 125"></label><label class="fl"><span>Produit</span><input data-k="produit" enterkeyhint="next" autocomplete="off" value="${esc(d.produit)}" placeholder="Nom du produit"></label></div></div>`+
 `<div class="panel"><h3>Photos du moule</h3><div class="meta">Ajoutez des photos pour documenter le moule, les branchements ou les réglages. Elles seront enregistrées avec la fiche.</div><div class="photo-tools"><button type="button" class="btn primary" id="addphotos">＋ Ajouter des photos</button><span class="meta" id="photocount"></span></div><input type="file" id="photopick" accept="image/*" multiple class="hidden"><div id="photogrid" class="photo-grid"></div></div>`+
 S.map((s,i)=>`<details class="sec" ${i===0?'open':''}><summary><span>${s.t}</span>${s.tol?`<span class="tol">±${s.tol}%</span>`:''}<span class="summarycount"></span></summary><div class="secbody">`+
 (s.g||[]).map(g=>`${g.n?`<div class="group-title">${g.n}</div>`:''}<div class="tablewrap"><table><tr><th></th>${g.c.map(c=>`<th>${c}</th>`).join('')}</tr>${g.r.map(r=>`<tr><th>${r}</th>${g.c.map((c,j)=>`<td><input data-k="${g.p+r+'_'+j}" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${esc(d[g.p+r+'_'+j])}" aria-label="${g.n} ${r} ${c}"></td>`).join('')}</tr>`).join('')}</table></div>`).join('')+
 `<div class="gridfields">${s.f.map(x=>fieldInput(x,d)).join('')}</div></div></details>`).join('')+
 bar('<button class="btn primary" id="save">Enregistrer la fiche</button>');
 let photos=Array.isArray(d.photos)?[...d.photos].filter(x=>!String(x).startsWith('data:')):[];const orig=[...photos],pending=new Map();
 const photoGrid=$('#photogrid'),photoCount=$('#photocount'),photoPick=$('#photopick');
 const drawPhotos=()=>{photoCount.textContent=photos.length+' photo(s)';photoGrid.innerHTML=photos.length?photos.map((pid,i)=>`<div class="photo-item"><img data-pid="${esc(pid)}" alt="Photo ${i+1}"><button type="button" data-photo-del="${i}" aria-label="Supprimer la photo">×</button></div>`).join(''):'<div class="photo-empty">Aucune photo ajoutée.</div>';photoGrid.querySelectorAll('[data-photo-del]').forEach(b=>b.onclick=()=>{photos.splice(Number(b.dataset.photoDel),1);drawPhotos()});photoGrid.querySelectorAll('img[data-pid]').forEach(im=>loadSrc(im.dataset.pid).then(x=>{im.src=x}))};
 const compressPhoto=file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=1280,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.72))};img.src=reader.result};reader.readAsDataURL(file)});
 $('#addphotos').onclick=()=>photoPick.click();photoPick.onchange=async e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));if(!files.length)return;for(const file of files){try{const data=await compressPhoto(file),pid=newPid();pending.set(pid,data);pcache.set(pid,data);photos.push(pid)}catch(err){toast('Impossible de lire une des photos')}}drawPhotos();photoPick.value=''};drawPhotos();
 const cnt=()=>app.querySelectorAll('details.sec').forEach(sec=>{const a=[...sec.querySelectorAll('input')];sec.querySelector('.summarycount').textContent=a.filter(x=>x.value.trim()).length+'/'+a.length});
 cnt();app.oninput=cnt;
 app.onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();const a=[...app.querySelectorAll('input')],n=a[a.indexOf(e.target)+1];if(n){const sec=n.closest('details');if(sec)sec.open=true;n.focus();n.select()}else e.target.blur()}};
 $('#cancel').onclick=()=>rec?view(rec.id):list();
 $('#save').onclick=async()=>{
  const nd={};app.querySelectorAll('input[data-k]').forEach(x=>{if(x.value.trim())nd[x.dataset.k]=x.value.trim()});
  if(!nd.moule){toast('Veuillez saisir le numéro du moule');const m=app.querySelector('[data-k="moule"]');m.focus();m.scrollIntoView({block:'center'});return}
  nd.produit=nd.produit||'';nd.photos=photos;['v0','v1','v2','v3','v4'].forEach(k=>delete nd[k]);
  try{for(const [pid,data] of pending)if(photos.includes(pid))await idbPut(pid,data);for(const pid of orig)if(!photos.includes(pid))await idbDel(pid)}catch(err){toast('Impossible d’enregistrer les photos');return}
  const now=Date.now();let r=rec;
  if(r){r.d=nd;r.ts=now}else{r={id:now.toString(36)+Math.random().toString(36).slice(2,6),ts:now,d:nd};db.push(r)}
  if(persist()){toast('Fiche enregistrée');view(r.id)}
 };
 scrollTopPage();
}
function view(id){
 const r=db.find(x=>x.id==id);if(!r)return list();const d=r.d;
 head('Fiche moule '+esc(d.moule),'Détail du paramétrage',`<button class="btn small" id="back">← Retour</button>`);
 let h=`<div class="hero"><div class="big">${esc(d.moule)}</div><h2>${esc(d.produit)||'Sans produit'}</h2><div class="meta">Dernière mise à jour : ${dt(r.ts)}</div></div>`;
 S.forEach(s=>{
  const f=s.f.filter(x=>d[x.k]!==undefined&&d[x.k]!==''),g=(s.g||[]).filter(g=>g.r.some(n=>g.c.some((c,j)=>d[g.p+n+'_'+j]!==undefined&&d[g.p+n+'_'+j]!=='')));
  if(!f.length&&!g.length)return;
  h+=`<details class="sec" open><summary><span>${s.t}</span>${s.tol?`<span class="tol">±${s.tol}%</span>`:''}</summary><div class="secbody">`+
  g.map(g=>`${g.n?`<div class="group-title">${g.n}</div>`:''}<div class="tablewrap"><table><tr><th></th>${g.c.map(c=>`<th>${c}</th>`).join('')}</tr>${g.r.map(n=>`<tr><th>${n}</th>${g.c.map((c,j)=>{const v=d[g.p+n+'_'+j];return v!==undefined&&v!==''?`<td class="value">${esc(v)}${s.tol?`<small>${rg(v,s.tol)}</small>`:''}</td>`:'<td class="value blank">—</td>'}).join('')}</tr>`).join('')}</table></div>`).join('')+
  `<div class="kvgrid">${f.map(x=>`<div class="kv"><span>${x.l}</span><b>${esc(d[x.k])}${x.u?' '+x.u:''}</b>${s.tol&&!x.t&&!x.nt?`<small>Plage indicative : ${rg(d[x.k],s.tol)}</small>`:''}</div>`).join('')}</div></div></details>`;
 });
 if(h===`<div class="hero"><div class="big">${esc(d.moule)}</div><h2>${esc(d.produit)||'Sans produit'}</h2><div class="meta">Dernière mise à jour : ${dt(r.ts)}</div></div>`)h+=`<div class="empty">Cette fiche ne contient pas encore de paramètres détaillés.</div>`;
 if(Array.isArray(d.photos)&&d.photos.length){h+=`<div class="panel"><h3>Photos du moule (${d.photos.length})</h3><div class="photo-grid">${d.photos.map((pid,i)=>`<div class="photo-item"><img data-pid="${esc(pid)}" alt="Photo ${i+1}"></div>`).join('')}</div></div>`}
 h+=bar('<button class="btn" id="edit">Modifier</button><button class="btn" id="duplicate">Dupliquer</button><button class="btn danger" id="delete">Supprimer</button>');
 app.innerHTML=h;app.oninput=app.onkeydown=null;app.querySelectorAll('img[data-pid]').forEach(im=>{loadSrc(im.dataset.pid).then(x=>{im.src=x});im.onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML='<img style="max-width:100%;max-height:100%;margin:auto">';m.firstChild.src=im.src;m.onclick=()=>m.remove();document.body.appendChild(m)}});
 $('#back').onclick=()=>list();$('#edit').onclick=()=>form(id);
 $('#duplicate').onclick=()=>{const c={...d};delete c.photos;form(null,c);toast('Copie prête : vérifiez le numéro du moule puis enregistrez')};
 $('#delete').onclick=()=>confirmBox(`Supprimer définitivement la fiche du moule ${d.moule} ?`,()=>{db=db.filter(x=>x.id!==id);(d.photos||[]).forEach(p=>idbDel(p).catch(()=>{}));if(persist()){toast('Fiche supprimée');list()}});
 scrollTopPage();
}
function confirmBox(message,yes){
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><h3>Confirmation</h3><p>${esc(message)}</p><div class="modalactions"><button class="btn" id="no">Annuler</button><button class="btn danger" id="yes">Confirmer la suppression</button></div></div>`;document.body.appendChild(m);
 m.querySelector('#no').onclick=()=>m.remove();m.querySelector('#yes').onclick=()=>{m.remove();yes()};m.onclick=e=>{if(e.target===m)m.remove()};
}
function download(name,content,type){
 const blob=new Blob(Array.isArray(content)?content:[content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
}
function backup(){
 const payload=JSON.stringify({app:'Fiches de paramétrage',version:2,exportedAt:new Date().toISOString(),fiches:db.map(r=>({...r,d:{...r.d,photos:[]}}))},null,2);
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="modalbox"><h3>Sauvegarde et restauration</h3><p>Conservez une copie de vos fiches pour éviter toute perte lors d'un changement de téléphone ou de réinstallation.</p><div class="modalactions"><button class="btn primary" id="export">Exporter un fichier JSON</button><button class="btn" id="copy">Copier le texte</button><button class="btn" id="importfile">Importer un fichier</button></div><textarea id="backuptext" readonly></textarea><div class="modalactions"><button class="btn" id="paste">Restaurer depuis le texte</button><button class="btn" id="close">Fermer</button></div><input type="file" id="filepick" accept=".json,application/json" class="hidden"></div>`;
 document.body.appendChild(m);const tx=m.querySelector('#backuptext');tx.value=payload;
 m.querySelector('#export').onclick=async()=>{
  const name='sauvegarde_fiches_parametrage_'+new Date().toISOString().slice(0,10)+'.json',cap=window.Capacitor,pl=(cap&&cap.Plugins)||{},FS=pl.Filesystem,SH=pl.Share;
  const native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&FS&&SH);
  const head='{"app":"Fiches de paramétrage","version":2,"fiches":[',tail=']}';
  const item=async(r,n)=>{const ph=[];for(const p of (r.d.photos||[]))ph.push(await idbGet(p)||'');return (n?',':'')+JSON.stringify({...r,d:{...r.d,photos:ph}})};
  toast('Préparation…');
  try{
   if(native){
    const o={path:name,directory:'CACHE',encoding:'utf8'};
    await FS.writeFile({...o,data:head});
    let n=0;for(const r of db)await FS.appendFile({...o,data:await item(r,n++)});
    await FS.appendFile({...o,data:tail});
    const u=await FS.getUri({path:name,directory:'CACHE'});
    await SH.share({title:'Sauvegarde des fiches',files:[u.uri],dialogTitle:'Enregistrer la sauvegarde'});
   }else{
    const parts=[head];let n=0;for(const r of db)parts.push(await item(r,n++));parts.push(tail);
    download(name,parts,'application/json');
   }
   toast('Sauvegarde complète prête (avec photos)');
  }catch(err){if(!/cancel/i.test(String((err&&err.message)||err)))toast('Échec de la sauvegarde')}
 };
 m.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(payload);toast('Sauvegarde copiée')}catch(e){tx.focus();tx.select();toast('Sélectionnez le texte puis copiez-le')}};
 m.querySelector('#importfile').onclick=()=>m.querySelector('#filepick').click();
 m.querySelector('#filepick').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());await restoreData(data,m)}catch(err){toast('Fichier JSON invalide')}};
 m.querySelector('#paste').onclick=()=>{if(tx.readOnly){tx.readOnly=false;tx.value='';tx.placeholder='Collez ici le texte de sauvegarde, puis touchez à nouveau Restaurer depuis le texte';tx.focus();m.querySelector('#paste').textContent='Restaurer maintenant'}else{try{restoreData(JSON.parse(tx.value),m).catch(()=>toast('Texte de sauvegarde invalide'))}catch(e){toast('Texte de sauvegarde invalide')}}};
 m.querySelector('#close').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
}
async function restoreData(data,modal){
 const incoming=Array.isArray(data)?data:(data&&Array.isArray(data.fiches)?data.fiches:null);
 if(!incoming)throw new Error('format');
 const clean=incoming.filter(x=>x&&x.id&&x.d&&typeof x.d==='object');
 if(!clean.length){toast('Aucune fiche valide trouvée');return}
 for(const x of clean){if(Array.isArray(x.d.photos)){const ids=[];for(const p of x.d.photos){if(String(p).startsWith('data:')){const id=newPid();await idbPut(id,p);ids.push(id)}}x.d.photos=ids}}
 const byId=new Map(db.map(x=>[x.id,x]));
 clean.forEach(x=>{const o=byId.get(x.id);if(o&&!(x.d.photos&&x.d.photos.length))x.d.photos=o.d.photos||[];byId.set(x.id,x)});
 db=[...byId.values()];
 if(persist()){modal.remove();list();toast(clean.length+' fiche(s) importée(s) ou mise(s) à jour')}
}
document.documentElement.dataset.theme='light';
migrate().catch(e=>console.error(e)).then(()=>{try{list()}catch(error){console.error(error);app.innerHTML='<div class="empty"><strong>Une erreur a empêché le démarrage.</strong>Fermez puis rouvrez ce fichier dans Chrome. Si le problème persiste, envoyez une capture d’écran.</div>'}});
</script>
</body>
</html>
